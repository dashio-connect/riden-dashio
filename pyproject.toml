[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rd6006-dashio"
version = "0.1.0"
description = "A RIDEN RD60xx power supply on USB as a DashIO device for the Dash app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dashio>=3.12", "pyserial>=3.5"]

[project.scripts]
rd6006_dashio = "rd6006_dashio.__main__:main"

[tool.setuptools]
packages = ["rd6006_dashio"]
